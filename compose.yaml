services:
  traefik:
    image: traefik:v3.7
    container_name: cloudy_traefik
    command:
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8081:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro,z
      - ./traefik/certs:/certs:ro,z

  postgres:
    image: postgres:17
    container_name: cloudy_postgres_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ktor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ACOUSTID_API_KEY: ${ACOUSTID_API_KEY}
      AUTH_SECRET: ${AUTH_SECRET}
      PORT: ${PORT}
      DB_URL: ${DB_URL}
      DB_DRIVER: ${DB_DRIVER}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      TOTAL_SPACE_PER_FOLDER: ${TOTAL_SPACE_PER_FOLDER}
    volumes:
      - ./app_docker_data:/app:z

volumes:
  postgres_data: